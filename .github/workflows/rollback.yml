name: Rollback

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version id to serve. Empty rolls back one step.'
                type: string
                default: ''

permissions:
    contents: read

jobs:
    rollback:
        uses: Jubstaaa/deploy-actions/.github/workflows/cloudflare-rollback.yml@478f6cf63cc24a7e830d88bb7d236057e2751e99 # v2.0.0
        with:
            version: ${{ inputs.version }}
        secrets:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
