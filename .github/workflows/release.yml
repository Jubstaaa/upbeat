name: Release

on:
    push:
        tags: ['v*']

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - name: Lint, types and tests
              run: npm run lint && npm run type-check && npm test

            - name: Verify the tag matches package.json
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG=$(node -p "require('./package.json').version")
                  if [ "$TAG" != "$PKG" ]; then
                    echo "Tag v$TAG does not match package.json version $PKG"
                    exit 1
                  fi

            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/jubstaaa/upbeat
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=raw,value=latest

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Publish the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VER="${GITHUB_REF_NAME#v}"
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
                    exit 0
                  fi
                  awk -v ver="## [$VER]" '
                    index($0, ver) == 1 { grab = 1; next }
                    grab && /^## \[/    { exit }
                    grab                { print }
                  ' CHANGELOG.md > /tmp/notes.md
                  if [ ! -s /tmp/notes.md ]; then
                    echo "No changelog entry for $VER" >&2
                    exit 1
                  fi
                  gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
                    --notes-file /tmp/notes.md --verify-tag --latest
