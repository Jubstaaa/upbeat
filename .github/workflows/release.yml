name: Release

on:
    push:
        tags: ['v*']

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            - run: bun install --frozen-lockfile

            - name: Lint, types and tests
              run: bun run lint && bun run typecheck && bun run test

            - name: Verify the tag matches package.json
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG=$(bun -p "require('./package.json').version")
                  if [ "$TAG" != "$PKG" ]; then
                    echo "Tag v$TAG does not match package.json version $PKG"
                    exit 1
                  fi

            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ghcr.io/jubstaaa/upbeat
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Publish the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VER="${GITHUB_REF_NAME#v}"
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
                    exit 0
                  fi
                  awk -v ver="## [$VER]" '
                    index($0, ver) == 1 { grab = 1; next }
                    grab && /^## \[/    { exit }
                    grab                { print }
                  ' CHANGELOG.md > /tmp/notes.md
                  if [ ! -s /tmp/notes.md ]; then
                    echo "No changelog entry for $VER" >&2
                    exit 1
                  fi
                  if [[ "$GITHUB_REF_NAME" == *-* ]]; then FLAG=--prerelease; else FLAG=--latest; fi
                  gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
                    --notes-file /tmp/notes.md --verify-tag "$FLAG"
